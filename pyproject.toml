[project]
name = "aws-project-manager"
version = "0.1.0"
description = "A tiny AWS DynamoDB-backed project & task manager CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "moto[dynamodb]>=5.0",
]

[project.scripts]
pm = "project_manager.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "dynamo: tests that exercise the DynamoDB backend via moto",
]
